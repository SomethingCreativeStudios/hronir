events {}

http {
  server {
    listen 8080;
    root /usr/share/nginx/html;
    default_type application/json;

    location = / {
      return 200 '{"links":[{"rel":"self","href":"/"}]}';
    }

    location = /asyncapi {
      return 200 '{"asyncapi":"2.6.0","servers":{"local":{"url":"tcp://mosquitto:1883"}},"channels":{"connected-systems/systems:events":{},"connected-systems/deployments:events":{},"connected-systems/procedures:events":{}}}';
    }

    location ~ ^/(systems|deployments|procedures|samplingFeatures|properties|datastreams|controlstreams)(/[^/]+)?$ {
      try_files /collection.json =404;
    }
  }
}
